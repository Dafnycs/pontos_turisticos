<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Trip Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1> Explorador de pontos turísticos</h1>
        <p class="subtitle">explore e se encante</p>

        <div class="trip-area">
            <img src="" alt="Ponto turístico" id="tripImage">
            <div id="tripName"></div>
        </div>

        <div class="controls">
            <button id="turiscBtn">Pontos turísticos aleatório</button>
        </div>

        <div class="search">
            <input
                type="text"
                id="tripInput"
                placeholder="Digite um ponto turístico (ex: cristo redentor)"
            >
            <button id="busca">🔍 Buscar</button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
